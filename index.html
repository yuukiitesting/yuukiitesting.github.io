<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAMPZ NINJA | SYSTEMS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#05050a',
                            dark: '#0a0a12',
                            cyan: '#00f3ff',
                            pink: '#ff00ff',
                            purple: '#bd00ff',
                            yellow: '#fcee0a'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Rajdhani', 'sans-serif']
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',

                        }

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <!-- Google Fonts: Orbitron (Headers), Rajdhani (Body), JetBrains Mono (Code) -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* Cyberpunk Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #05050a; }
        ::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff00ff; }

        body {
            background-color: #05050a;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* Glitch Text Effect for Title */
        .glitch-text {
            position: relative;
            color: #fff;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #05050a;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #ff00ff;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #00f3ff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(80px, 9999px, 100px, 0); }
            40% { clip: rect(10px, 9999px, 100px, 0); }
            60% { clip: rect(40px, 9999px, 60px, 0); }
            80% { clip: rect(120px, 9999px, 140px, 0); }
            100% { clip: rect(60px, 9999px, 90px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(100px, 9999px, 120px, 0); }
            20% { clip: rect(20px, 9999px, 60px, 0); }
            40% { clip: rect(120px, 9999px, 140px, 0); }
            60% { clip: rect(10px, 9999px, 40px, 0); }
            80% { clip: rect(60px, 9999px, 100px, 0); }
            100% { clip: rect(30px, 9999px, 70px, 0); }
        }

        /* Scanline Overlay */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            position: fixed;
            pointer-events: none;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 40;
            opacity: 0.6;
        }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons (Using FontAwesome Classes) ---
        const ArrowRight = ({ className }) => <i className={`fa-solid fa-arrow-right ${className}`}></i>;
        const Plus = ({ className }) => <i className={`fa-solid fa-plus ${className}`}></i>;
        const DiscordIcon = ({ className }) => <i className={`fa-brands fa-discord ${className}`}></i>;
        const SpotifyIcon = ({ className }) => <i className={`fa-brands fa-spotify ${className}`}></i>;
        const InstagramIcon = ({ className }) => <i className={`fa-brands fa-instagram ${className}`}></i>;

        // --- Components ---

        const Crosshair = ({ className = "", color = "text-red-600" }) => (
            <div className={`absolute w-3 h-3 ${color} flex items-center justify-center pointer-events-none select-none ${className}`}>
                <Plus className="text-[10px]" />
            </div>
        );

        // --- Cyberpunk Background Animation ---
        const CyberpunkBackground = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                
                // Configuration
                const rainColor = '#00f3ff';
                
                let drops = [];
                const fontSize = 14;
                let columns = 0;

                const resizeCanvas = () => {
                    const parent = canvas.parentElement;
                    if (parent) {
                        canvas.width = parent.offsetWidth;
                        canvas.height = parent.offsetHeight;
                        columns = Math.floor(canvas.width / fontSize);
                        drops = [];
                        for(let x = 0; x < columns; x++) {
                            drops[x] = Math.random() * canvas.height; 
                        }
                    }
                };

                const draw = () => {
                    if (!canvas) return;
                    
                    // Fade effect for trailing
                    ctx.fillStyle = 'rgba(5, 5, 10, 0.1)'; 
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // 1. Digital Rain 
                    ctx.fillStyle = rainColor;
                    ctx.font = fontSize + 'px monospace';
                    
                    for(let i = 0; i < drops.length; i++) {
                        if (Math.random() > 0.9) {
                            const text = String.fromCharCode(0x30A0 + Math.random() * 96); 
                            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                        }

                        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975)
                            drops[i] = 0;
                        
                        drops[i]++;
                    }

                    // 2. Perspective Grid
                    const w = canvas.width;
                    const h = canvas.height;
                    const horizon = h * 0.6; 
                    
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(189, 0, 255, 0.15)'; 
                    ctx.lineWidth = 1;

                    const centerX = w / 2;
                    for (let i = -w; i < w * 2; i += 100) {
                        ctx.moveTo(i, h);
                        ctx.lineTo(centerX, horizon);
                    }

                    const time = Date.now() / 50;
                    const lineOffset = time % 50;
                    
                    for (let y = horizon; y < h; y += 30) {
                        const drawY = y + lineOffset;
                        if(drawY < h) {
                            ctx.moveTo(0, drawY);
                            ctx.lineTo(w, drawY);
                        }
                    }
                    ctx.stroke();
                };

                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();
                
                const loop = () => {
                    draw();
                    animationFrameId = requestAnimationFrame(loop);
                }
                loop();

                return () => {
                    window.removeEventListener('resize', resizeCanvas);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return (
                <canvas ref={canvasRef} className="absolute inset-0 z-0 pointer-events-none mix-blend-screen" />
            );
        };

        const Nav = () => (
            <nav className="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-6 py-6 bg-cyber-black/80 backdrop-blur-md border-b border-cyber-cyan/20 w-full max-w-screen overflow-hidden">
                <div className="flex items-center gap-3 group cursor-pointer">
                    <div className="w-3 h-3 bg-cyber-cyan shadow-[0_0_10px_#00f3ff] group-hover:bg-cyber-pink group-hover:shadow-[0_0_15px_#ff00ff] transition-all duration-300 transform rotate-45"></div>
                    <div className="font-orbitron text-lg font-bold tracking-widest text-white group-hover:text-cyber-cyan transition-colors">

        const Section = ({ children, id, className = "" }) => (

        const ProjectCard = ({ title, desc, tags }) => (

                <div className="absolute top-0 left-0 w-2 h-2 border-t border-l border-cyber-cyan/50"></div>

        const ExpRow = ({ role, company, period, active = false }) => (

                <div className="flex flex-col sm:flex-row sm:items-baseline gap-2 sm:gap-8 relative z-10">
                    <span className="text-lg font-orbitron font-bold text-white tracking-wide group-hover:text-cyber-cyan transition-colors">{role}</span>
                    <span className="font-mono text-xs text-cyber-purple uppercase tracking-wider group-hover:text-white transition-colors">@ {company}</span>
                </div>
                <div className="mt-2 sm:mt-0 font-mono text-xs text-gray-500 group-hover:text-cyber-cyan relative z-10">
                    [{period}]
                </div>
            </div>
        );

        // --- Main App ---

        const App = () => {
            useEffect(() => {
                const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                link.type = 'image/svg+xml';
                link.rel = 'shortcut icon';
                link.href = `data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22black%22/><text x=%2250%22 y=%2270%22 font-size=%2270%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22%2300f3ff%22 text-anchor=%22middle%22>V</text></svg>`;
                document.getElementsByTagName('head')[0].appendChild(link);
                document.title = "VAMPZ NINJA | NETRUNNER"; 
            }, []);

            return (
                <div className="min-h-screen bg-cyber-black text-white font-sans selection:bg-cyber-pink selection:text-white overflow-x-hidden relative">
                    <div className="scanlines"></div>
                    
                    <Nav />

                    {/* Hero Section */}
                    <Section className="min-h-screen flex flex-col items-center justify-center pt-20 border-none relative overflow-hidden">
                        <CyberpunkBackground /> 
                        
                        <div className="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_20%,#05050a_100%)] z-10"></div>

                        <div className="z-20 text-center px-6 max-w-5xl mx-auto space-y-8 relative">
                            {/* Removed System Online Badge */}

                            <h1 className="text-6xl sm:text-8xl md:text-[9rem] font-extrabold tracking-tighter leading-[0.85] glitch-text font-orbitron uppercase drop-shadow-[0_0_10px_rgba(0,243,255,0.5)]" data-text="VAMPZ NINJA">
                                VAMPZ<br/>
                                <span className="text-transparent bg-clip-text bg-gradient-to-b from-white via-gray-300 to-gray-600">NINJA</span>
                            </h1>
                            
                            <div className="flex flex-col items-center gap-2">
                                <p className="text-cyber-pink font-mono text-sm sm:text-base tracking-[0.2em] uppercase animate-fade-in-delayed pl-2 text-shadow-neon">
                                    COMMUNITY ARCHITECTURE & SYSTEMS ENGINEERING
                                </p>
                                <div className="w-32 h-[1px] bg-gradient-to-r from-transparent via-cyber-purple to-transparent mt-4"></div>
                            </div>
                        </div>

                        <div className="absolute top-32 left-6 text-cyber-cyan/50 font-mono text-xs">
                            COORD: 45.23.11
                        </div>
                        <Crosshair className="top-32 right-6 md:right-12 text-cyber-pink" />
                        <Crosshair className="bottom-12 left-6 md:left-12 text-cyber-cyan" />
                        <div className="absolute bottom-12 right-6 md:right-12 text-cyber-pink/50 font-mono text-xs text-right">
                            STATUS: CONNECTED<br/>PING: 12ms
                        </div>
                    </Section>

                    {/* Myself Section */}
                    <Section id="about" className="grid grid-cols-1 md:grid-cols-12 border-t border-cyber-cyan/20">
                        <div className="md:col-span-4 p-8 sm:p-12 border-b md:border-b-0 md:border-r border-cyber-cyan/20 bg-cyber-dark/80 relative">
                            <Badge>01 // IDENTITY</Badge>
                            <h2 className="text-4xl font-orbitron font-bold mt-2 text-white">PROFILE</h2>
                            <div className="w-12 h-1 bg-cyber-pink mt-6"></div>

                        </div>
                        <div className="md:col-span-8 p-8 sm:p-12 flex flex-col justify-center backdrop-blur-sm bg-black/20">

                            </p>

                    </Section>

                    {/* Skillset Section */}

                        <div className="grid grid-cols-1 md:grid-cols-3">

                                items={["Enterprise-Scale Moderation", "Creator Ecosystems", "Growth Strategy", "Conflict Resolution"]}

                            <SkillCard 
                                title="Systems Architecture"

                    </Section>

                    {/* Journey Section */}
                    <Section id="experience">
                        <div className="grid grid-cols-1 md:grid-cols-12">
                            <div className="md:col-span-3 p-8 sm:p-12 border-b md:border-b-0 md:border-r border-cyber-cyan/20 bg-cyber-dark/80 relative">
                                <Badge>03 // LOGS</Badge>
                                <h2 className="text-4xl font-orbitron font-bold mt-2">TIMELINE</h2>
                                <div className="absolute bottom-4 right-4 text-cyber-pink/20 text-6xl font-orbitron font-bold opacity-20 select-none">03</div>
                            </div>
                            <div className="md:col-span-9 backdrop-blur-sm bg-black/20">
                                <ExpRow role="Community Director" company="High-Volume Creator Networks" period="4+ Years" active={true} />
                                <ExpRow role="Social Operations & Dev" company="Creator Partnerships" period="Current" />

                    {/* Selected Works Section */}

                        <div className="max-w-4xl w-full relative z-10">

</body>
